name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FITDASH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FITDASH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FITDASH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FITDASH_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/fitdash.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "FITDASH_KEYSTORE=$keystore"
            echo "FITDASH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FITDASH_KEY_ALIAS=$KEY_ALIAS"
            echo "FITDASH_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Collect APK
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "fitdash-v$version.apk"
          cp app/build/outputs/apk/release/app-release.apk fitdash.apk
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: fitdash-apk
          path: fitdash-v*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "fitdash-v${{ steps.apk.outputs.version }}.apk" fitdash.apk --clobber
          else
            gh release create "$tag" "fitdash-v${{ steps.apk.outputs.version }}.apk" fitdash.apk \
              --title "fitdash $tag" --generate-notes
          fi
