name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FITDASH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FITDASH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FITDASH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FITDASH_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/fitdash.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "FITDASH_KEYSTORE=$keystore"
            echo "FITDASH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FITDASH_KEY_ALIAS=$KEY_ALIAS"
            echo "FITDASH_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Test and build
        run: ./gradlew :app:testGithubDebugUnitTest :app:assembleGithubRelease :app:bundlePlayRelease

      - name: Collect APK and AAB
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/github/release/app-github-release.apk "fitdash-v$version.apk"
          cp app/build/outputs/apk/github/release/app-github-release.apk fitdash.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "fitdash-v$version-play.aab"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: fitdash-apk
          path: fitdash-v*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fitdash-play-aab
          path: fitdash-v*-play.aab

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "fitdash-v${{ steps.apk.outputs.version }}.apk" fitdash.apk "fitdash-v${{ steps.apk.outputs.version }}-play.aab" --clobber
          else
            gh release create "$tag" "fitdash-v${{ steps.apk.outputs.version }}.apk" fitdash.apk "fitdash-v${{ steps.apk.outputs.version }}-play.aab" \
              --title "fitdash $tag" --generate-notes
          fi

      - name: Upload to Google Play internal track
        if: env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.fitdash
          releaseFiles: fitdash-v${{ steps.apk.outputs.version }}-play.aab
          track: internal
          status: draft
